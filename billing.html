
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Billing and Payments</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/css/service.css">
</head>

<body>
<div class="brand"><b>VS</b> VEHICLE SERVICE <small>Management workspace</small></div>

<div class="container">

    <a href="/dashboard" class="back">← Back to Dashboard</a>

    <h2>Billing and Payments</h2>

    <form th:action="@{/billing/save}"
          th:object="${billing}" method="post">

        <input type="hidden" th:field="*{id}">

        <label>Customer Name</label>
        <input type="text" th:field="*{customerName}" required>

        <label>Vehicle Number</label>
        <input type="text" th:field="*{vehicleNumber}" required>

        <label>Service Description</label>
        <input type="text" th:field="*{serviceDescription}" required>

        <label>Amount (Rs.)</label>
        <input type="number" step="0.01"
               th:field="*{amount}" required>

        <label>Payment Status</label>
        <select th:field="*{paymentStatus}">
            <option value="Pending">Pending</option>
            <option value="Paid">Paid</option>
        </select>

        <button type="submit"
                th:text="${billing.id == null ? 'Generate Bill' : 'Update Bill'}">
            Generate Bill
        </button>

    </form>

    <h3>Billing Records</h3>

    <div class="table-wrap"><table border="1" width="100%">

        <tr>
            <th>ID</th>
            <th>Customer</th>
            <th>Vehicle</th>
            <th>Service</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>

        <tr th:each="b : ${billings}">

            <td th:text="${b.id}"></td>
            <td th:text="${b.customerName}"></td>
            <td th:text="${b.vehicleNumber}"></td>
            <td th:text="${b.serviceDescription}"></td>
            <td th:text="${b.amount}"></td>
            <td th:text="${b.paymentStatus}"></td>

            <td>
                <a th:href="@{/billing/edit/{id}(id=${b.id})}"
                   class="edit">Edit</a>

                <form th:action="@{/billing/delete/{id}(id=${b.id})}"
                      method="post"
                      class="delete-form"
                      onsubmit="return confirm('Are you sure you want to delete this bill?');">

                    <button type="submit" class="delete">
                        Delete
                    </button>

                </form>
            </td>

        </tr>

    </table></div>

</div>

</body>
</html>

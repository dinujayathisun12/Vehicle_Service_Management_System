
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Spare Parts Management</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/css/service.css">
</head>

<body>
<div class="brand"><b>VS</b> VEHICLE SERVICE <small>Management workspace</small></div>

<div class="container">

    <a href="/dashboard" class="back">← Back to Dashboard</a>

    <h2>Spare Parts Management</h2>

    <form th:action="@{/spare-parts/save}"
          th:object="${part}" method="post">

        <input type="hidden" th:field="*{id}">

        <label>Part Name</label>
        <input type="text" th:field="*{partName}" required>

        <label>Price (Rs.)</label>
        <input type="number" step="0.01"
               th:field="*{price}" required>

        <label>Quantity</label>
        <input type="number" th:field="*{quantity}" required>

        <button type="submit"
                th:text="${part.id == null ? 'Add Spare Part' : 'Update Spare Part'}">
            Add Spare Part
        </button>

    </form>

    <h3>Available Spare Parts</h3>

    <div class="table-wrap"><table border="1" width="100%">

        <tr>
            <th>ID</th>
            <th>Part Name</th>
            <th>Price (Rs.)</th>
            <th>Quantity</th>
            <th>Actions</th>
        </tr>

        <tr th:each="p : ${parts}">

            <td th:text="${p.id}"></td>
            <td th:text="${p.partName}"></td>
            <td th:text="${p.price}"></td>
            <td th:text="${p.quantity}"></td>

            <td>
                <a th:href="@{/spare-parts/edit/{id}(id=${p.id})}"
                   class="edit">Edit</a>

                <form th:action="@{/spare-parts/delete/{id}(id=${p.id})}"
                      method="post"
                      class="delete-form"
                      onsubmit="return confirm('Are you sure you want to delete this part?');">

                    <button type="submit" class="delete">
                        Delete
                    </button>

                </form>
            </td>

        </tr>

    </table></div>

</div>

</body>
</html>

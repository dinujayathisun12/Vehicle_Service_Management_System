
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customer Registration</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/css/service.css">
</head>

<body>
<div class="brand"><b>VS</b> VEHICLE SERVICE <small>Management workspace</small></div>

<div class="container">

    <a href="/dashboard" class="back">← Back to Dashboard</a>

    <h2>Customer Registration</h2>

    <form th:action="@{/customers/save}"
          th:object="${customer}" method="post">

        <input type="hidden" th:field="*{id}">

        <label>Customer Name</label>
        <input type="text" th:field="*{name}" required>

        <label>Phone Number</label>
        <input type="text" th:field="*{phone}" required>

        <label>Email</label>
        <input type="email" th:field="*{email}">

        <label>Address</label>
        <input type="text" th:field="*{address}">

        <button type="submit"
                th:text="${customer.id == null ? 'Register Customer' : 'Update Customer'}">
            Register Customer
        </button>

    </form>

    <h3>Registered Customers</h3>

    <div class="table-wrap"><table border="1" width="100%">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Actions</th>
        </tr>

        <tr th:each="c : ${customers}">

            <td th:text="${c.id}"></td>
            <td th:text="${c.name}"></td>
            <td th:text="${c.phone}"></td>

            <td>
                <a th:href="@{/customers/edit/{id}(id=${c.id})}"
                   class="edit">Edit</a>

                <form th:action="@{/customers/delete/{id}(id=${c.id})}"
                      method="post"
                      class="delete-form"
                      onsubmit="return confirm('Are you sure you want to delete this customer?');">

                    <button type="submit" class="delete">
                        Delete
                    </button>

                </form>
            </td>

        </tr>

    </table></div>

</div>

</body>
</html>
